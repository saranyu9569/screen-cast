# Builds the VIEW instructor app (android/) and publishes the APK as a GitHub Release,
# so instructors can download it from the repository's Releases page.
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write # create the release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # The signing key lives in repository secrets; every release must use the same key
      # or Android refuses to install the update over the previous version.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret (see README, Android app section)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/view.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/view.jks" >> "$GITHUB_ENV"

      - name: Test and build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "VIEW-$VERSION_NAME.apk"
          gh release create "android-v$VERSION_NAME" "VIEW-$VERSION_NAME.apk" \
            --title "VIEW แอปผู้สอน (Android) $VERSION_NAME" \
            --notes "ดาวน์โหลดไฟล์ VIEW-$VERSION_NAME.apk ด้านล่างแล้วติดตั้งบนแท็บเล็ต Android 10 ขึ้นไป" \
            --latest
